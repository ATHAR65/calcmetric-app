<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  role="img"
  aria-label="TheMetricApp"
>
  <defs>
    <radialGradient id="dotGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </radialGradient>
    <radialGradient id="dotGradDark" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#F0FDFA" />

  <!-- Dot-grid "W" icon centered in 32x32 -->
  <!-- Row 0 (top) -->
  <circle cx="9" cy="10" r="3.5" fill="url(#dotGrad)" />
  <circle cx="9" cy="10" r="1.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

  <circle cx="23" cy="10" r="3.5" fill="url(#dotGrad)" />
  <circle cx="23" cy="10" r="1.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

  <!-- Row 1 (middle) -->
  <circle cx="9" cy="16" r="4" fill="url(#dotGradDark)" />
  <circle cx="9" cy="16" r="1.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

  <circle cx="16" cy="16" r="4" fill="url(#dotGradDark)" />
  <circle cx="16" cy="16" r="1.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

  <circle cx="23" cy="16" r="4" fill="url(#dotGradDark)" />
  <circle cx="23" cy="16" r="1.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

  <!-- Row 2 (bottom) -->
  <circle cx="9" cy="23" r="3.5" fill="url(#dotGrad)" />
  <circle cx="9" cy="23" r="1.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

  <circle cx="23" cy="23" r="3.5" fill="url(#dotGrad)" />
  <circle cx="23" cy="23" r="1.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />
</svg>
