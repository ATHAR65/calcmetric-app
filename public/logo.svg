<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 450 100"
  width="100%"
  height="100%"
  role="img"
  aria-label="WiseFinanceCalc"
>
  <defs>
    <radialGradient id="dotGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </radialGradient>
    <radialGradient id="dotGradDark" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0D9488" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect for depth (optional) -->
  <rect x="2" y="18" width="68" height="64" rx="16" fill="#F0FDFA" opacity="0.5" />

  <!-- Dot-grid "W" icon -->
  <g filter="url(#shadow)">
    <!-- Row 0 (top) -->
    <circle cx="18" cy="32" r="8" fill="url(#dotGrad)" />
    <circle cx="18" cy="32" r="3" fill="rgba(255,255,255,0.35)" opacity="0.6" />

    <circle cx="54" cy="32" r="8" fill="url(#dotGrad)" />
    <circle cx="54" cy="32" r="3" fill="rgba(255,255,255,0.35)" opacity="0.6" />

    <!-- Row 1 (middle) -->
    <circle cx="18" cy="50" r="9" fill="url(#dotGradDark)" />
    <circle cx="18" cy="50" r="3.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

    <circle cx="36" cy="50" r="9" fill="url(#dotGradDark)" />
    <circle cx="36" cy="50" r="3.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

    <circle cx="54" cy="50" r="9" fill="url(#dotGradDark)" />
    <circle cx="54" cy="50" r="3.5" fill="rgba(255,255,255,0.35)" opacity="0.6" />

    <!-- Row 2 (bottom) -->
    <circle cx="18" cy="68" r="8" fill="url(#dotGrad)" />
    <circle cx="18" cy="68" r="3" fill="rgba(255,255,255,0.35)" opacity="0.6" />

    <circle cx="54" cy="68" r="8" fill="url(#dotGrad)" />
    <circle cx="54" cy="68" r="3" fill="rgba(255,255,255,0.35)" opacity="0.6" />
  </g>

  <!-- Text: WiseFinance -->
  <text
    x="86"
    y="57"
    font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="700"
    font-size="32"
    fill="#0F172A"
    letter-spacing="-0.02em"
    dominant-baseline="middle"
  >
    WiseFinance
  </text>

  <!-- Text: Calc -->
  <text
    x="276"
    y="57"
    font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-weight="400"
    font-size="32"
    fill="#0D9488"
    letter-spacing="-0.02em"
    dominant-baseline="middle"
  >
    Calc
  </text>
</svg>
